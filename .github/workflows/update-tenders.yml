name: Update tenders

on:
  schedule:
    - cron: "0 3 * * *"   # every day at 03:00 UTC (08:00 Pakistan time)
  workflow_dispatch:       # lets you run it by hand from the GitHub website

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - run: python tender_pipeline.py
      - name: Save updated tenders
        run: |
          git config user.name "tender-bot"
          git config user.email "tender-bot@users.noreply.github.com"
          git add tenders.js
          git diff --cached --quiet || git commit -m "Update tenders"
          git push
